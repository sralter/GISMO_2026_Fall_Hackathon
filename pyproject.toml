[project]
name = "gismo-2026-fall-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sralter", email = "s.r.alter@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "jupyterlab>=4.6.6",
    "laspy[lazrs]>=2.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyproj>=3.8.0",
    "pyvista>=0.49.2",
    "s3fs>=2026.9.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
    "vtk>=9.7.2",
    "xarray>=2026.9.0",
]

[project.scripts]
gismo-2026-fall-hackathon = "gismo_2026_fall_hackathon:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
